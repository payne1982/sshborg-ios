name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (iOS Simulator)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen and xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate the Xcode project
        run: xcodegen generate

      # Pinning a simulator by name breaks every time Apple ships a new lineup,
      # so pick whichever iPhone the runner actually has.
      - name: Pick a simulator
        run: |
          udid=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for r in d for x in d[r] if 'iPhone' in x['name']))")
          echo "SIMULATOR_ID=$udid" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep -m1 -B0 iPhone

      # Caching SPM matters a lot here: libssh2 and OpenSSL are compiled from
      # source and dominate the build time.
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      # SwiftTerm ships Metal shaders, and from Xcode 26 the Metal compiler is a
      # separate component that is not present by default.
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project SSHBorg.xcodeproj \
            -scheme SSHBorg \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
