# XcodeGen project definition.
#
# The .xcodeproj is not committed: regenerate it with `xcodegen generate`.
# This keeps the project editable from any machine (including Linux) and the
# diffs readable, avoiding the merge conflicts .pbxproj files are notorious for.
#
#   brew install xcodegen && xcodegen generate && open SSHBorg.xcodeproj

name: SSHBorg

options:
  bundleIdPrefix: com.sshborg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    # `targeted` rather than `complete`: concurrency violations stay warnings
    # instead of breaking the build. Raise to `complete` (and SWIFT_VERSION 6)
    # once the SSH layer has settled.
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.15.0
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.11.1
  # libssh2 built from source with the OpenSSL backend and zlib.
  # Product: CSSH2. Defines HAVE_SYS_UN_H, which agent forwarding needs for the
  # in-process UNIX socket agent (see phase 7 of PIANO.md).
  CSSH2:
    url: https://github.com/Lakr233/libssh2-spm
    from: 2.0.3

targets:
  SSHBorg:
    type: application
    platform: iOS
    # XcodeGen classifies .xcassets and .xcprivacy as resources on its own.
    sources:
      - path: Sources
        excludes:
          - "**/.gitkeep"
    configFiles:
      Debug: Configs/Signing.xcconfig
      Release: Configs/Signing.xcconfig
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: GRDB
        product: GRDB
      - package: CSSH2
        product: CSSH2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sshborg
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: SSHBorg
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # A terminal is unusable without landscape.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Biometric lock (phase 1)
        NSFaceIDUsageDescription: SSHBorg uses Face ID to unlock access to your saved hosts and keys.
        # Key import/export and SFTP transfers (phases 5-6)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # TODO: confirm before submission — see README, "Export compliance".
        # The app embeds OpenSSL and performs general-purpose cryptography, so
        # the conservative declaration is `true`.
        ITSAppUsesNonExemptEncryption: true

  SSHBorgTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SSHBorgTests
    dependencies:
      - target: SSHBorg

schemes:
  SSHBorg:
    build:
      targets:
        SSHBorg: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SSHBorgTests
    archive:
      config: Release
