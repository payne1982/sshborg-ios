# XcodeGen project definition.
#
# The .xcodeproj is not committed: regenerate it with `xcodegen generate`.
# This keeps the project editable from any machine (including Linux) and the
# diffs readable, avoiding the merge conflicts .pbxproj files are notorious for.
#
#   brew install xcodegen && xcodegen generate && open SSHBorg.xcodeproj

name: SSHBorg

options:
  bundleIdPrefix: com.sshborg
  # 16.0, not 17.0: the A11 devices (iPhone 8, 8 Plus, X) stop at iOS 16.7.x,
  # and one of them is the only physical machine this app has ever been able to
  # run on. Four things are unverifiable on a simulator — Keychain encryption,
  # the app lock against real biometrics, anything translucent, and jailbreak
  # detection — so the floor is what stands between a borrowed phone and the
  # first real test.
  #
  # 16 is cheap where 15 is not: NavigationStack and LocalizedStringResource
  # (381 uses) are both iOS 16. The one API that had to go was @Observable; see
  # the Perception package below.
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  developmentLanguage: en
  # The ten languages of Localizable.xcstrings, imported from the Android app by
  # scripts/import-android-strings.py. Xcode only emits a localisation it knows
  # about, so a language missing here is silently dropped from the build.
  knownRegions:
    - en
    - de
    - es
    - fr
    - it
    - ja
    - pt
    - ru
    - uk
    - zh-Hans

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    # `targeted` rather than `complete`: concurrency violations stay warnings
    # instead of breaking the build. Raise to `complete` (and SWIFT_VERSION 6)
    # once the SSH layer has settled.
    SWIFT_STRICT_CONCURRENCY: targeted
    # The version the App Store shows: major.minor.patch, and every release must
    # be higher than the last one published. Its own history, not Android's
    # 1.16.x — the About row names the platform, so reports are not confused.
    MARKETING_VERSION: "1.0.0"
    # The build: one more for every upload to App Store Connect, TestFlight
    # included, and never reset between versions — the counterpart of Android's
    # versionCode.
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.15.0
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.11.1
  # libssh2 built from source with the OpenSSL backend and zlib.
  # Product: CSSH2. Defines HAVE_SYS_UN_H, which agent forwarding needs for the
  # in-process UNIX socket agent.
  #
  # 2.0.3 vendors libssh2 1.11.1 (commit a312b43, the release commit itself),
  # which is the current upstream stable — there is no 1.12. It pulls OpenSSL
  # from openssl-spm with `from: 3.6.0`, so it resolves to the newest 3.6.x and
  # deliberately not to 4.0: libssh2 1.11.1 predates OpenSSL 4 and is not known
  # to build against it. SSHBorgTests pins the runtime floor at 1.11.1.
  CSSH2:
    url: https://github.com/Lakr233/libssh2-spm
    from: 2.0.3
  # Already in the graph as libssh2's crypto backend; declared here so Swift can
  # import it too. Agent forwarding has to sign with an RSA key held as OpenSSH
  # stores it — n, e, d, p, q and no dp/dq — which SecKey cannot load, so
  # SSHSigner uses OpenSSL's bignums instead of growing its own. The version
  # range matches libssh2-spm's exactly, so SPM resolves one shared checkout and
  # the binary gains nothing.
  OpenSSL:
    url: https://github.com/Lakr233/openssl-spm
    from: 3.6.0
  # Swift's Observation framework, back-ported. @Observable is iOS 17, and it is
  # the only thing that kept the deployment target there.
  #
  # The alternative was going back to ObservableObject/@Published, which is not
  # equivalent: @Observable tracks reads through nested objects and
  # ObservableObject does not, so the ~15 view-body reads through AppEnvironment
  # (environment.preferences.terminalFontSize, environment.sessions.sessions,
  # environment.lock.isLocked, and environment.browsers.isOpen(hostID:) — a
  # method, with no property to attach @ObservedObject to) would have compiled,
  # run, and shown stale values. Perception keeps the semantics, at the price of
  # WithPerceptionTracking around every body. Forget it and you get a runtime
  # warning, not silence.
  #
  # On iOS 17+ the macro emits real Observable conformance and
  # WithPerceptionTracking is a passthrough, so nothing is paid on new devices.
  #
  # Pinned exactly, not `from:` — and the pin is about the Xcode installed here,
  # not about the library. 2.0.12 raised its own manifest to
  # swift-tools-version 6.4; Xcode 26.6 ships Swift 6.3.3 and will not read a
  # 6.4 manifest at all, so the build dies at package resolution before
  # compiling a line. `from:` would resolve straight past 2.0.11 into it.
  #
  # Nothing is being given up: 2.0.12 is a bump for IssueReporting 2.1 and a
  # documentation link.
  #
  # The pin expires by itself. StackCheckTests.testPerceptionPinIsStillNeeded
  # fails the moment the toolchain reaches Swift 6.4, and says what to do.
  Perception:
    url: https://github.com/pointfreeco/swift-perception
    exactVersion: 2.0.11

targets:
  SSHBorg:
    type: application
    platform: iOS
    # XcodeGen classifies .xcassets and .xcprivacy as resources on its own.
    sources:
      - path: Sources
        excludes:
          - "**/.gitkeep"
    configFiles:
      Debug: Configs/Signing.xcconfig
      Release: Configs/Signing.xcconfig
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: GRDB
        product: GRDB
      - package: CSSH2
        product: CSSH2
      - package: OpenSSL
        product: OpenSSL
      - package: Perception
        product: Perception
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sshborg
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Declares libssh2's bcrypt_pbkdf, which lives in a private header but
        # is compiled into the library we already link. See the header itself
        # for why this is not reimplemented.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Crypto/SSHBorg-Bridging-Header.h
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: SSHBorg
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # JetBrains Mono Nerd Font Mono, the same file the Android build ships.
        # Without it every Powerline/Nerd glyph in a prompt renders as a box.
        # Registration fails silently if a name here is wrong, so
        # TerminalFontTests asserts the font actually resolved.
        UIAppFonts:
          - JetBrainsMonoNerdFontMono-Regular.ttf
          - JetBrainsMonoNerdFontMono-Bold.ttf
        # A terminal is unusable without landscape.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Biometric lock (phase 1)
        NSFaceIDUsageDescription: SSHBorg uses Face ID to unlock access to your saved hosts and keys.
        # Key import/export and SFTP transfers (phases 5-6)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # `false` means "no export compliance documentation to upload", which
        # is what Apple's key asks — not whether the app uses cryptography (it
        # does: libssh2 and OpenSSL). App Store Connect's questionnaire, answered
        # on 13/09/2026 with standard algorithms only and the app not offered
        # in France, concluded that no documents are needed. See README,
        # "Export compliance": the answer stops being true the day France is
        # added without an ANSSI declaration.
        #
        # `true` without an ITSEncryptionExportComplianceCode is rejected at
        # upload with ITMS-90592.
        ITSAppUsesNonExemptEncryption: false

  SSHBorgTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SSHBorgTests
    dependencies:
      - target: SSHBorg

  # Drives the running app. Exists because reports like "the settings screen
  # does not scroll" cannot be settled by reading code, and because the unit
  # tests never render a view — these attach screenshots, which is the only
  # automated look anyone gets at the interface.
  SSHBorgUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/SSHBorgUITests
    dependencies:
      - target: SSHBorg

schemes:
  SSHBorg:
    build:
      targets:
        SSHBorg: all
    run:
      config: Debug
    test:
      config: Debug
      # Indirection on purpose: the scheme carries only the placeholders, and
      # the real values are passed on the xcodebuild command line, so no
      # credential is ever committed. Without them the SSH integration tests
      # skip themselves.
      #
      #   xcodebuild test … SSHBORG_TEST_HOST=… SSHBORG_TEST_USER=… \
      #                     SSHBORG_TEST_PASSWORD=…
      environmentVariables:
        SSHBORG_TEST_HOST: $(SSHBORG_TEST_HOST)
        SSHBORG_TEST_PORT: $(SSHBORG_TEST_PORT)
        SSHBORG_TEST_USER: $(SSHBORG_TEST_USER)
        SSHBORG_TEST_PASSWORD: $(SSHBORG_TEST_PASSWORD)
        # Base64 channel, because Xcode *evaluates* build setting values: a `$`
        # in a password reads as a reference to another setting, and the test
        # receives something else. Measured: 16 characters in, 33 out.
        SSHBORG_TEST_PASSWORD_B64: $(SSHBORG_TEST_PASSWORD_B64)
      targets:
        - SSHBorgTests
        - SSHBorgUITests
    archive:
      config: Release
